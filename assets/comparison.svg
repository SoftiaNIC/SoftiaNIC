  <text x="666" y="232" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">sof.ia</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="666" y="282" fill="#FFFFFF" font-size="14" font-weight="750">Arquitectura</text><text x="810" y="282" fill="#C6C1CE" font-size="13">Next.js, React, Node, Python y Golang.</text>
    <line x1="666" y1="300" x2="1202" y2="300" stroke="#FFFFFF" stroke-opacity="0.07"/>
