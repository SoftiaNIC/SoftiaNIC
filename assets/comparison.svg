    <text x="76" y="382" fill="#FFFFFF" font-size="14" font-weight="750">Seguridad</text><text x="220" y="382" fill="#888391" font-size="13">Vulnerable a ataques constantes.</text>
    <line x1="76" y1="400" x2="584" y2="400" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="76" y="432" fill="#FFFFFF" font-size="14" font-weight="750">Escalabilidad</text><text x="220" y="432" fill="#888391" font-size="13">Reescritura completa al crecer.</text>
