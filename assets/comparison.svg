  <text x="48" y="51" fill="#A88CFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2.2">01 · FILOSOFÍA</text>
  <text x="48" y="98" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="850">Ingeniería sin límites.</text>
  <text x="48" y="130" fill="#AAA6B4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">No construimos sobre plantillas ni gestores limitados. Diseñamos arquitecturas robustas que evolucionan con su empresa.</text>

