    <text x="76" y="282" fill="#FFFFFF" font-size="14" font-weight="750">Arquitectura</text><text x="220" y="282" fill="#888391" font-size="13">Rígida y dependiente de plugins.</text>
    <line x1="76" y1="300" x2="584" y2="300" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="76" y="332" fill="#FFFFFF" font-size="14" font-weight="750">Rendimiento</text><text x="220" y="332" fill="#888391" font-size="13">Cargas lentas y SEO deficiente.</text>
